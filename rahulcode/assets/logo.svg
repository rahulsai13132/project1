<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Cap / AI Icon -->
  <g transform="translate(15, 20)">
    <path d="M 40 10 L 75 30 L 40 50 L 5 30 Z" fill="url(#grad1)" filter="url(#glow)"/>
    <path d="M 20 40 L 20 60 C 20 70, 60 70, 60 60 L 60 40" fill="none" stroke="url(#grad1)" stroke-width="4"/>
    <circle cx="75" cy="30" r="4" fill="#EC4899"/>
    <line x1="75" y1="30" x2="75" y2="55" stroke="#EC4899" stroke-width="3"/>
  </g>
  <!-- Text -->
  <text x="105" y="62" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">SmartCampus <tspan fill="url(#grad1)">AI</tspan></text>
  <text x="107" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="2">NEXT-GEN COLLEGE MANAGEMENT</text>
</svg>
